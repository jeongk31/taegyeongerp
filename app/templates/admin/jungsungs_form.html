{% extends "base.html" %}
{% block title %}{% if jungsung %}담당중상 변경{% else %}담당중상 등록{% endif %} - 태경바이오 ERP{% endblock %}

{% block content %}
<a href="{{ url_for('admin.jungsungs_list') }}" class="back-link">&larr; 목록으로</a>

<div class="row">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">{% if jungsung %}담당중상 변경{% else %}담당중상 등록{% endif %}</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">소속지사 <span class="required">*</span></label>
                        <select name="branch_id" class="form-select" required>
                            <option value="">선택</option>
                            {% for branch in branches %}
                            <option value="{{ branch.id }}" {% if jungsung and jungsung.branch_id == branch.id %}selected{% endif %}>{{ branch.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">사업자명 <span class="required">*</span></label>
                        <input type="text" name="business_name" class="form-control" value="{{ jungsung.business_name if jungsung else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">담당자명</label>
                        <input type="text" name="contact_person" class="form-control" value="{{ jungsung.contact_person if jungsung else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">연락처</label>
                        <input type="text" name="phone" class="form-control" value="{{ jungsung.phone if jungsung else '' }}" placeholder="010-0000-0000">
                    </div>

                    <hr class="section-divider">

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">{% if jungsung %}변경{% else %}등록{% endif %}</button>
                        <a href="{{ url_for('admin.jungsungs_list') }}" class="btn btn-outline-secondary">뒤로가기</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
