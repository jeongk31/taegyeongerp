{% extends "base.html" %}
{% block title %}{% if supplier %}제품입고업체 변경{% else %}제품입고업체 등록{% endif %} - 태경바이오 ERP{% endblock %}

{% block content %}
<a href="{{ url_for('admin.suppliers_list') }}" class="back-link">&larr; 목록으로</a>

<div class="row">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">{% if supplier %}제품입고업체 변경{% else %}제품입고업체 등록{% endif %}</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">회사명 <span class="required">*</span></label>
                        <input type="text" name="company_name" class="form-control" value="{{ supplier.company_name if supplier else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">담당자</label>
                        <input type="text" name="contact_person" class="form-control" value="{{ supplier.contact_person if supplier else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">연락처</label>
                        <input type="text" name="phone" class="form-control" value="{{ supplier.phone if supplier else '' }}" placeholder="010-0000-0000">
                    </div>

                    <hr class="section-divider">

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">{% if supplier %}변경{% else %}등록{% endif %}</button>
                        <a href="{{ url_for('admin.suppliers_list') }}" class="btn btn-outline-secondary">취소</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
